---
# base.yaml
# Shared hyperparameters for both models:

training:  # Group related training parameters
  batch_size: 512
  lr: 0.0001
  epochs: 10
  weight_decay: 0.00005
  patience: 5
  patience_server: 1000

model:  # Group model-related parameters
  hidden: 512
  dropout: 0.1
  num_layers: 5
  hidden_ext: 64
  model_type: "pointwise"

federation: # Group federation-related parameters
  federation_rounds: 350
  num_clients: 32

main:
  cpu: 1
  gpu: 0

# Other settings
repetition: 10